plugins {
    id 'com.android.application'
}
android {
    namespace 'cl.craftyplus.control'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.craftyplus.control'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-modern-ui'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
