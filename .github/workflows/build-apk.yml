name: Compilar Crafty+ APK

on:
  workflow_dispatch:
  push:
    branches: [main, build/crafty-0.2.0-modern-ui]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4
      - name: Instalar API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar APK y comparar firmas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          head -n 1 apk-badging.txt
          grep -F "package: name='cl.craftyplus.control' versionCode='2' versionName='0.2.0-modern-ui'" apk-badging.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          sha256sum "$apk"
          mkdir previous
          if gh run download 43466900056 --repo "$GITHUB_REPOSITORY" --name CraftyPlus-Control-APK-beta --dir previous; then
            "$tools/aapt" dump badging previous/app-debug.apk > previous/badging.txt
            head -n 1 previous/badging.txt
            "$tools/apksigner" verify --print-certs previous/app-debug.apk
          else
            echo 'No se pudo descargar el APK anterior para comparar el certificado.'
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftyPlus-Control-0.2.0-modern-ui
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
