name: Compilar Crafty+ APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Instalar el SDK de Android
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Compilar el APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v7
        with:
          name: CraftyPlus-Control-APK-beta
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
